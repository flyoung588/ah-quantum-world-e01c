name: E01-C2 three-point numerical certification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h2-c2-one-off
  cancel-in-progress: false
jobs:
  h2:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install binary wheels only, no persistent cache
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r requirements.txt
      - name: Run three predeclared points, strict 6 GiB address-space cap
        run: |
          ulimit -v 6291456
          python -u c2/run_certification.py
